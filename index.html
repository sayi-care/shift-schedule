function render(){let g=document.getElementById("grid"),mobile=window.matchMedia("(max-width:600px)").matches,nameWidth=mobile?112:130,dayWidth=mobile?34:36;g.style.gridTemplateColumns=`${nameWidth}px repeat(${dates.length},${dayWidth}px)`;g.style.minWidth=(nameWidth+dates.length*dayWidth)+"px";g.innerHTML=`<div class="cell head name">${t("employeeName")}</div>`+dates.map((d,j)=>`<div class="cell head dayhead"><b>${d}</b><small>${t("weekdays")[(dateWeekdays[j]+6)%7]}</small></div>`).join("");employees.forEach((n,i)=>{g.innerHTML+=`<div class="cell name employee-name"><b>${n}</b><small>${employeeDetails[i]||""}</small></div>`;dates.forEach((d,j)=>{let k=key(i,j),s=data[k]||"",note=notes[k]||"";g.innerHTML+=`<div class="cell shift ${cls(s)}" onclick="edit(${i},${j})"><span class="shift-label">${shiftDisplay(s)}</span><small class="note-label">${note}</small></div>`})});renderDailyTotals(g);renderEmployees();renderStats()}
function renderDailyTotals(g){let countedShifts=Object.keys(shifts).filter(s=>s!=="P6"&&s!=="特");g.innerHTML+=`<div class="cell summary-group">${t("dailyTotal")}</div>`+dates.map(()=>'<div class="cell summary-empty"></div>').join("");countedShifts.forEach(s=>{g.innerHTML+=`<div class="cell summary-label">${shiftCountLabel(s)}</div>`+dates.map((_,j)=>{let count=Object.entries(data).filter(([k,v])=>Number(k.split("-")[1])===j&&(s==="有休"?(v==="有休"||v==="特"):v===s)).length;return `<div class="cell summary-count">${count}</div>`}).join("")})}
function edit(i,j){if(isReadOnlySession())return;selected=[i,j];let k=key(i,j);selectedShift=data[k]||"";document.getElementById("modalEmployee").textContent=employees[i]+" / "+t("dayPrefix")+dates[j]+(language==="ja"?"日":"");document.getElementById("shiftNote").value=notes[k]||"";document.getElementById("modal").style.display="flex";document.getElementById("choices").innerHTML=Object.keys(shifts).map(s=>`<button class="${selectedShift===s?"selected":""}" onclick="selectShift('${s}')"><b>${shiftOptionLabel(s)}</b><br><small>${shiftDescription(s)}</small></button>`).join("")}
function selectShift(s){selectedShift=s;document.getElementById("choices").innerHTML=Object.keys(shifts).map(x=>`<button class="${selectedShift===x?"selected":""}" onclick="selectShift('${x}')"><b>${shiftOptionLabel(x)}</b><br><small>${shiftDescription(x)}</small></button>`).join("")}
function saveShift(){if(isReadOnlySession())return;let k=key(selected[0],selected[1]),note=document.getElementById("shiftNote").value.trim();if(selectedShift)data[k]=selectedShift;else delete data[k];if(note)notes[k]=note;else delete notes[k];saveData();closeModal();render()} function clearShift(){if(isReadOnlySession())return;let k=key(selected[0],selected[1]);delete data[k];delete notes[k];saveData();closeModal();render()} function closeModal(){document.getElementById("modal").style.display="none"}
function openAdd(){if(isReadOnlySession())return;employeeEditIndex=null;document.getElementById("employeeModalTitle").textContent=t("addEmployee").replace("＋ ","");document.getElementById("newName").value="";document.getElementById("employeeInfo").value="";document.getElementById("deleteEmployeeButton").style.display="none";document.getElementById("addModal").style.display="flex"}
function editEmployee(i){if(isReadOnlySession())return;employeeEditIndex=i;document.getElementById("employeeModalTitle").textContent=t("editEmployee");document.getElementById("newName").value=employees[i];document.getElementById("employeeInfo").value=employeeDetails[i]||"";document.getElementById("deleteEmployeeButton").style.display="inline-block";document.getElementById("addModal").style.display="flex"}
function closeAdd(){document.getElementById("addModal").style.display="none"}
function saveEmployee(){if(isReadOnlySession())return;let n=document.getElementById("newName").value.trim(),info=document.getElementById("employeeInfo").value.trim();if(!n)return;if(employeeEditIndex===null){employees.push(n);employeeDetails.push(info)}else{employees[employeeEditIndex]=n;employeeDetails[employeeEditIndex]=info}saveData();closeAdd();render();tab(1)}
function moveEmployee(i,delta){if(isReadOnlySession())return;let target=i+delta;if(target<0||target>=employees.length)return;[employees[i],employees[target]]=[employees[target],employees[i]];[employeeDetails[i],employeeDetails[target]]=[employeeDetails[target],employeeDetails[i]];function swapRows(store){let next={};Object.entries(store).forEach(([k,v])=>{let [row,day]=k.split("-");row=Number(row);if(row===i)row=target;else if(row===target)row=i;next[row+"-"+day]=v});return next}data=swapRows(data);notes=swapRows(notes);Object.entries(periodStores).forEach(([p,s])=>{if(p!==currentPeriodKey()){s.data=swapRows(s.data||{});s.notes=swapRows(s.notes||{})}});saveData();render()}
function deleteEmployeeAt(i){if(isReadOnlySession())return;employeeEditIndex=i;deleteEmployee()}
function deleteEmployee(){if(isReadOnlySession()||employeeEditIndex===null)return;let i=employeeEditIndex;if(!confirm(t("confirmDelete")+employees[i]+t("confirmDeleteTail")))return;employees.splice(i,1);employeeDetails.splice(i,1);function reindex(store){let next={};Object.entries(store).forEach(([k,v])=>{let [row,day]=k.split("-");row=Number(row);if(Number.isInteger(row)&&row!==i)next[(row>i?row-1:row)+"-"+day]=v});return next}data=reindex(data);notes=reindex(notes);Object.entries(periodStores).forEach(([p,s])=>{if(p!==currentPeriodKey()){s.data=reindex(s.data||{});s.notes=reindex(s.notes||{})}});saveData();closeAdd();render();tab(1)}
function renderEmployees(){document.getElementById("employeeList").innerHTML=employees.map((n,i)=>`<div class="card employee"><div class="avatar">${n[0]}</div><div class="employee-details"><b>${n}</b><div class="meta">${employeeDetails[i]||""}</div></div><div class="employee-actions"><button class="small-btn" title="${t("moveUp")}" aria-label="${t("moveUp")}: ${n}" ${i===0?"disabled":""} onclick="moveEmployee(${i},-1)">↑</button><button class="small-btn" title="${t("moveDown")}" aria-label="${t("moveDown")}: ${n}" ${i===employees.length-1?"disabled":""} onclick="moveEmployee(${i},1)">↓</button><button class="small-btn" onclick="editEmployee(${i})">${t("edit")}</button><button class="small-btn delete" onclick="deleteEmployeeAt(${i})">${t("delete")}</button></div></div>`).join("")}
function renderStats(){let types=Object.keys(shifts).filter(s=>s!=="P6"&&s!=="特"),table=document.getElementById("employeeShiftTable");table.innerHTML=`<thead><tr><th>${t("employeeName")}</th>${types.map(s=>`<th>${shiftCountLabel(s)}</th>`).join("")}<th>${t("totalFilled")}</th></tr></thead><tbody>`+employees.map((n,i)=>{let row=Object.entries(data).filter(([k])=>Number(k.split("-")[0])===i),countFor=s=>row.filter(([,v])=>s==="有休"?(v==="有休"||v==="特"):v===s).length,total=types.reduce((sum,s)=>sum+countFor(s),0);return `<tr><td>${n}<small>${employeeDetails[i]||""}</small></td>${types.map(s=>`<td>${countFor(s)}</td>`).join("")}<td>${total}</td></tr>`}).join("")+"</tbody>";document.getElementById("legend").innerHTML=Object.entries(shifts).filter(([a])=>a!=="特").map(([a])=>`<p><b>${shiftOptionLabel(a)}</b>　${shiftDescription(a)}</p>`).join("")}
function openNav(){document.getElementById("navOverlay").style.display="block"} function closeNav(){document.getElementById("navOverlay").style.display="none"}
function syncConfigured(){return SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_")&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")}
function renderSyncUI(){document.body.classList.toggle("auth-required",!cloudUser);document.getElementById("authGateTitle").textContent=t("authRequiredTitle");document.getElementById("authGateMessage").textContent=t("authRequiredMessage");document.getElementById("authGateButton").textContent=st("login");let login=document.getElementById("syncLoginButton"),logout=document.getElementById("syncLogoutButton");document.body.classList.toggle("read-only",isReadOnlySession());document.getElementById("syncStatus").textContent=st(syncStateKey);login.textContent=st("login");login.style.display=syncConfigured()&&!cloudUser?"block":"none";login.disabled=!syncConfigured();logout.textContent=st("logout");logout.style.display=cloudUser?"block":"none";document.getElementById("syncModalTitle").textContent=st("title");document.getElementById("syncModalHelp").textContent=st("help");document.getElementById("syncEmailLabel").textContent=st("email");document.getElementById("syncPasswordLabel").textContent=st("password");document.getElementById("syncSubmitButton").textContent=st("submit");document.querySelector("#syncModal button[type=button]").textContent=st("cancel")}
function openSyncModal(){closeNav();if(!syncConfigured()){syncStateKey="notConfigured";renderSyncUI();return}document.getElementById("syncLoginError").textContent="";document.getElementById("syncPassword").value="";document.getElementById("syncModal").style.display="flex"}
function closeSyncModal(){document.getElementById("syncModal").style.display="none"}
async function signInSync(event){event.preventDefault();let errorBox=document.getElementById("syncLoginError"),button=document.getElementById("syncSubmitButton");button.disabled=true;errorBox.textContent=st("connecting");try{let{error}=await cloudClient.auth.signInWithPassword({email:document.getElementById("syncEmail").value.trim(),password:document.getElementById("syncPassword").value});if(error)throw error;closeSyncModal()}catch(error){errorBox.textContent=st("failed")}finally{button.disabled=false}}
async function signOutSync(){if(!cloudClient)return;await cloudClient.auth.signOut();cloudUser=null;cloudCanEdit=null;if(cloudChannel){await cloudClient.removeChannel(cloudChannel);cloudChannel=null}syncStateKey="notSignedIn";renderSyncUI();render()}
function sharedPayload(){return{employees,employeeDetails,periodStores,selectedPeriod:currentPeriodKey()}}
function applySharedPayload(payload,updatedAt){if(!payload||!Array.isArray(payload.employees))return;cloudApplying=true;employees=payload.employees;employeeDetails=Array.isArray(payload.employeeDetails)?payload.employeeDetails:employees.map(()=>"介護職員　|　2階");while(employeeDetails.length<employees.length)employeeDetails.push("介護職員　|　2階");periodStores=payload.periodStores&&typeof payload.periodStores==="object"?payload.periodStores:{};let match=/^(\d{4})-(\d{2})$/.exec(payload.selectedPeriod||"");if(match){periodYear=Number(match[1]);periodMonth=Number(match[2])}let current=periodStores[currentPeriodKey()]||{data:{},notes:{}};data=current.data||{};notes=current.notes||{};removeUnusedShifts();lastCloudUpdatedAt=updatedAt||lastCloudUpdatedAt;storeLocalData();buildDates();updatePeriod();render();cloudApplying=false;syncStateKey=cloudCanEdit?"connected":"readOnly";renderSyncUI()}
async function writeSharedState(){if(!cloudClient||!cloudUser||cloudCanEdit!==true||cloudApplying)return;let updatedAt=new Date().toISOString(),payload=sharedPayload();try{let{error}=await cloudClient.from(SHARED_TABLE).upsert({id:1,payload,updated_at:updatedAt,updated_by:cloudUser.id},{onConflict:"id"});if(error)throw error;lastCloudUpdatedAt=updatedAt;syncStateKey="connected";return true}catch(error){syncStateKey="error";return false}finally{renderSyncUI()}}
async function connectSharedData(){if(!cloudClient||cloudConnecting)return;if(!cloudUser){cloudCanEdit=false;syncStateKey="notSignedIn";renderSyncUI();render();return}cloudConnecting=true;syncStateKey="connecting";renderSyncUI();try{if(cloudUser){let{data:permission,error:permissionError}=await cloudClient.rpc("can_edit_shift_schedule");if(permissionError)throw permissionError;cloudCanEdit=permission===true}else{cloudCanEdit=false}renderSyncUI();let{data:row,error}=await cloudClient.from(SHARED_TABLE).select("payload,updated_at").eq("id",1).maybeSingle();if(error)throw error;if(row)applySharedPayload(row.payload,row.updated_at);else if(cloudCanEdit){await writeSharedState()}else{syncStateKey="emptySchedule"}if(!cloudChannel){cloudChannel=cloudClient.channel("shift-schedule-live").on("postgres_changes",{event:"*",schema:"public",table:SHARED_TABLE,filter:"id=eq.1"},event=>{let value=event.new;if(value&&value.updated_at&&value.updated_at!==lastCloudUpdatedAt)applySharedPayload(value.payload,value.updated_at)}).subscribe(status=>{if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){syncStateKey="error";renderSyncUI()}})}if(row)syncStateKey=cloudCanEdit?"connected":"readOnly";else if(cloudCanEdit)syncStateKey="connected"}catch(error){cloudCanEdit=false;syncStateKey="error"}finally{cloudConnecting=false;renderSyncUI();render()}}
async function initializeSync(){if(!syncConfigured()){syncStateKey="notConfigured";renderSyncUI();return}if(!window.supabase||!window.supabase.createClient){syncStateKey="error";renderSyncUI();return}cloudCanEdit=false;renderSyncUI();cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);cloudClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session){cloudUser=session.user;cloudCanEdit=null;syncStateKey="connecting";renderSyncUI();setTimeout(()=>connectSharedData(),0)}else if(event==="SIGNED_OUT"){cloudUser=null;cloudCanEdit=false;syncStateKey="connecting";renderSyncUI();setTimeout(()=>connectSharedData(),0)}});let{data:{session},error}=await cloudClient.auth.getSession();if(error){syncStateKey="error";renderSyncUI();return}if(session){cloudUser=session.user;await connectSharedData()}else{cloudUser=null;await connectSharedData()}}
function scrollSchedule(direction){let wrap=document.getElementById("scheduleScroll");wrap.scrollBy({left:direction*Math.max(160,wrap.clientWidth*.8),behavior:"smooth"})}
function tab(n){["schedule","employees","stats","shiftTimes"].forEach((x,i)=>document.getElementById(x).classList.toggle("hidden",i!==n));[0,1,2,3].forEach(i=>document.getElementById("nav"+i).classList.toggle("active",i===n));closeNav()}
function changePeriod(delta){saveData();periodMonth+=delta;if(periodMonth<1){periodMonth=12;periodYear--}else if(periodMonth>12){periodMonth=1;periodYear++}let saved=periodStores[currentPeriodKey()]||{data:{},notes:{}};data=saved.data||{};notes=saved.notes||{};buildDates();updatePeriod();render();saveData()}
function prev(){changePeriod(-1)} function next(){changePeriod(1)}
loadData();removeUnusedShifts();saveData();buildDates();applyLanguage();render();renderSyncUI();initializeSync();window.addEventListener("resize",render);window.addEventListener("online",()=>{if(cloudUser)writeSharedState()});
</script></body></html>
